<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 264" role="img" font-family="Assistant, sans-serif">
<!-- 03.09: the big square used to sit flush on the viewBox edge, so its right
     stroke was clipped to half-width; the box now leaves room for the stroke.
     The measurements read RTL, so the unit sits LEFT of the number. -->
<rect x="30" y="122" width="100" height="100" fill="#e1d9ff" stroke="#3b2fc2" stroke-width="2.5"/>
<text x="80" y="177" text-anchor="middle" font-size="22" font-weight="700" fill="#303030">א</text>
<text x="80" y="247" text-anchor="middle" font-size="17" fill="#303030" direction="rtl">4 ס"מ</text>
<rect x="160" y="22" width="200" height="200" fill="#cec7ff" stroke="#3b2fc2" stroke-width="2.5"/>
<text x="260" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#303030">ב</text>
<text x="260" y="247" text-anchor="middle" font-size="17" fill="#303030" direction="rtl">8 ס"מ</text>
</svg>
