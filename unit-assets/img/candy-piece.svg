<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 48" role="img">
<defs>
  <radialGradient id="ball" cx="0.36" cy="0.3" r="0.78">
    <stop offset="0" stop-color="#ff9db2"/><stop offset="0.42" stop-color="#ef4f70"/>
    <stop offset="1" stop-color="#b41f42"/>
  </radialGradient>
  <linearGradient id="tw" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff8ba6"/><stop offset="0.5" stop-color="#e5395c"/>
    <stop offset="1" stop-color="#a81c3d"/>
  </linearGradient>
</defs>
<ellipse cx="36" cy="43.5" rx="21" ry="3.2" fill="#000" opacity="0.13"/>
<!-- left twist -->
<path d="M20,24 C13,16 8,12 3,10 C6,17 6,31 3,38 C8,36 13,32 20,24 Z" fill="url(#tw)"/>
<g stroke="#8e1733" stroke-width="0.9" opacity="0.55" fill="none">
  <path d="M8,13.5 C10,20 10,28 8,34.5"/><path d="M13,16.5 C15,21 15,27 13,31.5"/>
</g>
<!-- right twist -->
<path d="M52,24 C59,16 64,12 69,10 C66,17 66,31 69,38 C64,36 59,32 52,24 Z" fill="url(#tw)"/>
<g stroke="#8e1733" stroke-width="0.9" opacity="0.55" fill="none">
  <path d="M64,13.5 C62,20 62,28 64,34.5"/><path d="M59,16.5 C57,21 57,27 59,31.5"/>
</g>
<!-- gathered pinch points -->
<ellipse cx="21.5" cy="24" rx="3" ry="6" fill="#c72a4d"/>
<ellipse cx="50.5" cy="24" rx="3" ry="6" fill="#c72a4d"/>
<!-- body -->
<ellipse cx="36" cy="24" rx="16" ry="15" fill="url(#ball)"/>
<ellipse cx="36" cy="24" rx="16" ry="15" fill="none" stroke="#9e1839" stroke-width="1.2" opacity="0.5"/>
<!-- wrapper twist creases across the body -->
<g stroke="#ffd7e0" stroke-width="1.1" opacity="0.4" fill="none">
  <path d="M23,17 C29,20 43,20 49,17"/><path d="M23,31 C29,28 43,28 49,31"/>
</g>
<!-- highlight -->
<ellipse cx="30" cy="17.5" rx="6.4" ry="4.2" fill="#fff" opacity="0.55" transform="rotate(-28 30 17.5)"/>
<circle cx="42.5" cy="30.5" r="2" fill="#fff" opacity="0.3"/>
</svg>